{% set name = "starplot" %}
{% set version = "0.21.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/starplot-{{ version }}.tar.gz
  sha256: b542f825ba68021da26d4746c66f4bd93cdc1de4835d15258942a4f0d784e683

build:
  entry_points:
    - starplot = starplot.cli:main
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - flit-core >=3.2,<4
    - pip
  run:
    - python >={{ python_min }}
    - numpy >=1.26.2
    - pandas <=2.2.3
    - pydantic >=2.10.6
    - shapely >=2.0.1
    - skyfield >=1.41
    - geopandas >=1.0.1
    - pillow >=10.0.0
    - pyyaml >=6.0.1
    - pyarrow >=14.0.2
    - rtree >=1.2.0
    - requests >=2.31.0
    - duckdb >=1.4.4
    - ibis-framework >=11.0.0
    - astropy-healpix >=1.1.2
    - sqlglot >=28.9.0
    - pyqtree == 1.0.0
    - fonttools >= 4.62.1
    - pydantic-extra-types >= 2.11.1
    - cairosvg >= 2.9.0

test:
  imports:
    - starplot
  commands:
    - pip check
  requires:
    - python {{ python_min }}
    - pip

about:
  summary: Star charts and maps of the sky
  dev_url: https://github.com/steveberardi/starplot
  home: https://starplot.dev/
  license: MIT
  license_file:
    - LICENSE

extra:
  recipe-maintainers:
    - steveberardi
